---
# OGF FILE METADATA (not family-history data)
# This document configures how an OGF file is interpreted and presented by a viewer.
# It may contain language, display-field templates, date wording, and optional
# relationship mappings for visualisations such as the family tree.
# These settings do not describe people, events, or relationships themselves.
id: "@meta@"
type: Meta
language: en
encoding: UTF-8
individual_display_field: full_name
family_display_field: "{$wife_id.full_name} & {$husband_id.full_name}"
date_approx: "About {date}"
date_uncertain: "Possibly {date}"
date_range: "Between {start} and {end}"
date_before: "On or before {date}"
date_after: "On or after {date}"
tree_relationships:
  individual_type: Individual
  family_type: Family
  family:
    partner_fields:
      - husband_id
      - wife_id
    child_fields:
      - child_id

---
# FIELD DICTIONARY (not family-history data)
# This document provides human-readable labels and optional value choices for
# fields used in the records below. It helps OGF viewers display and edit fields
# consistently; it does not contain genealogical facts or add data to records.
id: "@dictionary@"
type: Dictionary

full_name: Full Name
given_name: Given Name
middle_name: Middle Name
family_name: Family Name
gender: Gender
gender_values: "male=Male | female=Female | nonbinary=Non-binary | unknown=Unknown"

birth_date: Birth Date
birth_place: Birth Place
death_date: Death Date
death_place: Death Place
occupation: Occupation

husband_id: Husband
wife_id: Wife
child_id: Child
marriage_date: Marriage Date
marriage_place: Marriage Place
div: Divorce
div_values: "Y=Yes | N=No"

source_id: Source
note: Note
title: Title
author: Author
publication: Publication
text: Text
website: Website
reference_code: Reference Code
