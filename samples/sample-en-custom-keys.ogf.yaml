---
# OGF FILE METADATA (not family-history data)
# This document configures how an OGF file is interpreted and presented by a viewer.
# It defines the versioned data-to-renderer contract, including shared
# interpretation mappings and renderer-specific settings.
# These settings do not describe people, events, or relationships themselves.
id: "@meta@"
type: Meta
format_version: 1
version: 3
language: en
encoding: UTF-8
date_approx: "About {date}"
date_uncertain: "Possibly {date}"
date_range: "Between {start} and {end}"
date_before: "On or before {date}"
date_after: "On or after {date}"
date_calculated: "Calculated {date}"
date_estimated: "Estimated {date}"
date_from: "From {date}"
date_to: "Until {date}"
gender:
  field: gender
  values:
    - male
    - female
    - nonbinary
  labels:
    male: Male
    female: Female
    nonbinary: Non-binary
  male: male
  female: female
