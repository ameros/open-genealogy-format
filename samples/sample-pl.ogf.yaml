---
# OGF FILE METADATA (not family-history data)
# This document configures how an OGF file is interpreted and presented by a viewer.
# It defines the versioned data-to-renderer contract, including shared
# interpretation mappings and renderer-specific settings.
# These settings do not describe people, events, or relationships themselves.
id: "@meta@"
type: Meta
format_version: 1
version: 3
language: pl
encoding: UTF-8
gender:
  field: plec
  values:
    - M
    - F
    - U
  male: M
  female: F
tree:
  individual_type: Individual
  family_type: Family
  individual:
    birth: { date: urodzenie_data, place: urodzenie_miejsce }
    death: { date: zgon_data, place: zgon_miejsce }
  family:
    partners: [maz_id, zona_id]
    children: [dziecko_ids]
    marriage: { date: slub_data, place: slub_miejsce }
image_field: obje_file
individual_display_field: "{imie} {drugie_imie} {nazwisko}"
family_display_field: "{$zona_id.imie} {$zona_id.nazwisko} & {$maz_id.imie} {$maz_id.nazwisko}"
date_approx: "Około {date}"
date_uncertain: "Prawdopodobnie {date}"
date_range: "Między {start} a {end}"
date_before: "Nie później niż {date}"
date_after: "Nie wcześniej niż {date}"
---
# FIELD DICTIONARY (not family-history data)
# This document provides human-readable labels and optional value choices for
# fields used in the records below. It helps OGF viewers display and edit fields
# consistently; it does not contain genealogical facts or add data to records.
id: "@dictionary@"
type: Dictionary

urodzenie_data: Data urodzenia
urodzenie_miejsce: Miejsce urodzenia

imie: Imię
drugie_imie: Drugie imię
nazwisko: Nazwisko

plec: Płeć
zawod: Zawód

zgon_data: Data śmierci
zgon_miejsce: Miejsce śmierci

tytul: Tytuł
maz_id: Mąż
zona_id: Żona
dziecko_ids: Dzieci
slub_data: Data ślubu
slub_miejsce: Miejsce ślubu

zrodlo_id: Źródło
notatka: Notatka

autor: Autor
publikacja: Publikacja
tekst: Treść
strona_www: Strona WWW
zdjecie_plik: Plik zdjęcia
